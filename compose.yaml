services:
  web:
    build: .
    ports:
      - "127.0.0.1:8080:80"
    environment:
      DB_HOST: db
      DB_NAME: fieldnotes
      DB_USER: fieldnotes
      DB_PASSWORD: ${DB_PASSWORD:-local-blog-password}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: fieldnotes
      MYSQL_USER: fieldnotes
      MYSQL_PASSWORD: ${DB_PASSWORD:-local-blog-password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-local-root-password}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1' > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  mysql_data:
